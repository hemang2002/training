# NodePort = reachable from outside the cluster on <node-ip>:30080.
#   minikube : minikube service cifar-ui -n ml-demo --url
#   kind     : kubectl -n ml-demo port-forward svc/cifar-ui 8501:8501
#   k3s VM   : http://<vm-public-ip>:30080  (open the port in the cloud firewall)
apiVersion: v1
kind: Service
metadata:
  name: cifar-ui
  namespace: ml-demo
spec:
  type: NodePort
  selector:
    app: cifar-ui
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30080
