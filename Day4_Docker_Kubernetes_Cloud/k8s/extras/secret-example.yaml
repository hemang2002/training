# OPTIONAL (pairs with Day 3 LAB exercise 2 - API key auth).
# Secrets hold sensitive config. NOTE: base64 is encoding, NOT encryption - anyone with read access
# to Secrets in the namespace can decode them. Never commit real secrets to git.
#
# Preferred: create it from the command line instead of a file:
#   kubectl -n ml-demo create secret generic cifar-secrets --from-literal=API_KEY=change-me
#
# Then add to the api container in 02-api-deployment.yaml:
#   env:
#     - name: API_KEY
#       valueFrom:
#         secretKeyRef: {name: cifar-secrets, key: API_KEY}
apiVersion: v1
kind: Secret
metadata:
  name: cifar-secrets
  namespace: ml-demo
type: Opaque
stringData:
  API_KEY: change-me
